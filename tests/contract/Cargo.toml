[package]
name = "kwb-contract-tests"
version = "0.1.0"
description = "Assertions about the workspace itself: the README's band table against the real workspace, both directions."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The tool registry, so `projections.rs` can project it rather than parse the source that
# declares it. `KWB-62` recorded that this crate depends on nothing and that a check meant to
# catch a stale claim should not be why a serialization crate enters the workspace -- that
# argument is about *third-party* dependencies and is unchanged. A projection has to read the
# canonical value; reading the text that declares it would make the check a second parser of
# the thing it exists to stop being restated.
kwb-mcp = { workspace = true }

[lints]
workspace = true
