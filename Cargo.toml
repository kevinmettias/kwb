[workspace]
members = [
    # Band 0 — contracts. What earns a place here is the same admission test
    # nomos-contracts uses (see f:/repos/nomos, OD-CONTRACTS-001): a type crosses a
    # subsystem, process or plugin boundary and the parties on both sides need one
    # stable shared representation of it. The band table is README.md; nothing here
    # restates it. Depends on serde and nothing else.
    "crates/contracts/kwb-contracts",

    # Band 1 — kernel. Canonical identity (content-derived, dedup-by-construction) and
    # the content-addressed document store.
    "crates/kernel/kwb-model",
    "crates/kernel/kwb-store",

    # Band 1p — platform port. Traits in kwb-platform, implementations beside it.
    "crates/platform/kwb-platform",
    "crates/platform/kwb-platform-std",

    # Band 1p — the one crate permitted to name XVPE. `D-007` decided adoption is by
    # git reference and commit SHA rather than by path, and `D-012` decided what is
    # adopted: the persistent map versioned state is built on, rather than a versioned
    # map written here.
    "crates/platform/kwb-platform-xvpe",

    # Band 2 — domain. The epistemic reasoning surface: claims, concepts,
    # argumentation, evidence, coverage and the derivation ledger. One crate for now,
    # mirroring the .NET prototype's single Domain project; splitting is a decision to
    # make once growth justifies a boundary, not before.
    "crates/domain/kwb-domain",

    # Band 3 — ingestion. The admission pipeline: link-concepts, normalize-concepts,
    # admit, in the .NET prototype's own order until a reason to change it is found.
    "crates/ingestion/kwb-extract",
  "crates/ingestion/kwb-ingest",

    # Band 3 — retrieval. Search and graph traversal over the domain model.
    "crates/retrieval/kwb-retrieval",

    # Band 10 — host. Composition roots and binaries.
    "crates/host/kwb-cli",
    "crates/host/kwb-mcp",

    # Assertions about the workspace itself.
    "tests/contract",

    # The source-reading its guards share. A test crate, reached only through `dev-dependencies`,
    # so it is linked into no shipped binary and appears in no band.
    "tests/guards",
]

resolver = "3"

[workspace.package]
edition = "2024"
# Measured rather than inferred from the edition: 1.85.0 and 1.86.0 fail to build this
# workspace and 1.87.0 is the first that does. The floor is not this repository's own, whose
# lowest crates still compile on 1.85. It arrives through `kwb-platform-xvpe`, where the
# pinned `xvpe-collections-map` uses `integer_sign_cast`, stable since 1.87. `D-007`'s
# quarantine confines the XVPE edge to one manifest; it does not confine the toolchain floor
# that edge carries, so this number moves when that pin moves and is re-measured when it does.
rust-version = "1.87"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
kwb-contracts = { path = "crates/contracts/kwb-contracts" }
kwb-model = { path = "crates/kernel/kwb-model" }
kwb-store = { path = "crates/kernel/kwb-store" }
kwb-platform = { path = "crates/platform/kwb-platform" }
kwb-platform-std = { path = "crates/platform/kwb-platform-std" }
kwb-platform-xvpe = { path = "crates/platform/kwb-platform-xvpe" }
kwb-domain = { path = "crates/domain/kwb-domain" }
kwb-extract = { path = "crates/ingestion/kwb-extract" }
kwb-ingest = { path = "crates/ingestion/kwb-ingest" }
kwb-retrieval = { path = "crates/retrieval/kwb-retrieval" }
# The hosts. `kwb-mcp` is here because `tests/contract` depends on it, and nothing else does:
# a composition root depended on by a check is an unusual shape for a workspace, and it is
# deliberate. Why that edge exists is stated in `tests/contract/Cargo.toml`, beside the edge,
# rather than a second time here.
kwb-mcp = { path = "crates/host/kwb-mcp" }
kwb-source-guards = { path = "tests/guards" }

serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
sha2 = "0.10"

# Workspace-wide lint policy, mirrored from f:/repos/nomos/Cargo.toml, itself mirrored
# from f:/repos/xvpe/Cargo.toml — the same policy across all three repositories on
# purpose, so a contributor moving between them is not also relearning severities.
[workspace.lints.rust]
non_snake_case = "allow"
unsafe_code = "warn"
private_interfaces = "deny"
private_bounds = "deny"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
float_cmp = "deny"
needless_return = "allow"
unwrap_used = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"

[profile.dev]
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
