[package]
name = "kwb-retrieval"
version = "0.1.0"
# A charter rather than an inventory, for the reason kwb-platform's carries. This one
# advertised semantic and hybrid queries that do not exist, one of which D-004 holds
# the ground for and this repository has deliberately refused to stub.
description = "Answering questions about the graph, and never changing it."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The band this crate sits in, which decides which bands it may depend on. Read by
# `tests/contract`, which projects `README.md`'s bands table from these rather than from a
# second list -- `KWB-75`. Cargo ignores `package.metadata`; it is the place a manifest
# offers for exactly this.
[package.metadata.kwb]
band = "3"

[dependencies]
kwb-model = { workspace = true }
kwb-domain = { workspace = true }

[dev-dependencies]
# Reading this crate's own source, for the no-write-path guard. A dev-dependency, so the crate
# itself still declares no edge it does not use.
kwb-source-guards = { workspace = true }

[lints]
workspace = true
