[package]
name = "kwb-cli"
version = "0.1.0"
description = "The composition root: the kwb binary."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kwb"
path = "src/main.rs"

[dependencies]
# A composition root names the library and no backend the library does not
# already have. Nothing here is domain logic.
kwb-domain = { workspace = true }
kwb-ingest = { workspace = true }
kwb-store = { workspace = true }

[lints]
workspace = true
