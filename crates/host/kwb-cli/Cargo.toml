[package]
name = "kwb-cli"
version = "0.1.0"
description = "The `kwb` composition root."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The band this crate sits in, which decides which bands it may depend on. Read by
# `tests/contract`, which projects `README.md`'s bands table from these rather than from a
# second list -- `KWB-75`. Cargo ignores `package.metadata`; it is the place a manifest
# offers for exactly this.
[package.metadata.kwb]
band = "10"

[[bin]]
name = "kwb"
path = "src/main.rs"

[dependencies]
# A composition root names the library and no backend the library does not
# already have. Nothing here is domain logic.
kwb-domain = { workspace = true }
kwb-ingest = { workspace = true }
kwb-store = { workspace = true }
# The composition root is where an implementation of a port is named. The library
# names the port and nothing else, which is the whole reason this layer exists.
kwb-platform = { workspace = true }
kwb-platform-std = { workspace = true }
# The clock. `KWB-64`: it is adopted from XVPE rather than declared here, so the implementation
# this root composes in arrives through the one crate permitted to name XVPE.
kwb-platform-xvpe = { workspace = true }

[lints]
workspace = true
