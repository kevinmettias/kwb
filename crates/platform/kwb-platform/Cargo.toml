[package]
name = "kwb-platform"
version = "0.1.0"
# A charter rather than an inventory. A description that lists what a crate contains is
# a copy of its source and drifts every time the source changes -- which is how this
# one came to name four ports, three of which do not exist, while the crate exported
# two it did not mention. What a crate is *for* does not go stale that way.
description = "The seam an implementation is chosen behind: one port per thing the outside world does for this repository."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The band this crate sits in, which decides which bands it may depend on. Read by
# `tests/contract`, which projects `README.md`'s bands table from these rather than from a
# second list -- `KWB-75`. Cargo ignores `package.metadata`; it is the place a manifest
# offers for exactly this.
[package.metadata.kwb]
band = "1p"

[dependencies]

[lints]
workspace = true
